name: Build kptools.exe (Windows)

on:
  workflow_dispatch:
  push:

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: msys2/setup-msys2@v2
        with:
          update: true
          msystem: ucrt64
          path-type: inherit
          install: >-
            msys/make
            msys/cmake
            msys/gcc
            msys/zlib-devel

      - name: Build
        shell: msys2 {0}
        run: |
          cp -f kernel/include/preset.h tools/
          cd tools
          cmake . && make

      - name: Collect exe and dlls
        shell: msys2 {0}
        run: |
          mkdir -p win
          cp tools/kptools.exe win/
          ldd tools/kptools.exe | grep '/usr/bin/msys-' | sed -E 's/^.*=> ([^ ]+).*$/\1/' | xargs -I{} cp -v {} win/
          ls -la win

      - uses: actions/upload-artifact@v4
        with:
          name: kptools-win
          path: win/
